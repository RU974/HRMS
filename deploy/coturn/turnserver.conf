# coturn configuration for HRMS audio/video calls.
#
# Install:   apt install coturn        (then set TURNSERVER_ENABLED=1 in /etc/default/coturn)
# Config:    /etc/turnserver.conf
# Restart:   systemctl restart coturn
#
# Replace every value marked CHANGE_ME.
#
# Firewall — open on the TURN host:
#   3478   udp+tcp   TURN / STUN
#   5349   tcp       TURN over TLS  (gets through most corporate proxies)
#   49152-65535 udp  relay port range (must match min-port / max-port below)

listening-port=3478
tls-listening-port=5349

# The public IP of this server. If the host is behind 1:1 NAT (AWS, Azure, ...) use
# external-ip=<public-ip>/<private-ip>
external-ip=CHANGE_ME_PUBLIC_IP

realm=CHANGE_ME_turn.example.com
server-name=CHANGE_ME_turn.example.com

# ── Authentication ──────────────────────────────────────────────────────────
# Time-limited credentials generated by the HRMS API (see App\Services\CallService).
# This value MUST equal CALL_TURN_SECRET in backend/.env. Generate one with:
#   openssl rand -hex 32
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_CALL_TURN_SECRET

fingerprint
no-cli

# ── TLS (for turns: on 5349) ────────────────────────────────────────────────
cert=/etc/letsencrypt/live/CHANGE_ME_turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/CHANGE_ME_turn.example.com/privkey.pem
no-tlsv1
no-tlsv1_1

# ── Relay ports ─────────────────────────────────────────────────────────────
min-port=49152
max-port=65535

# ── Abuse limits ────────────────────────────────────────────────────────────
# Per-user concurrent allocations and a global cap so one client cannot exhaust the server.
user-quota=12
total-quota=1200
stale-nonce=600

# ── Do not let the relay reach your internal network ────────────────────────
# Without these, an authenticated user could use the TURN server to probe
# private addresses behind it. Clients on the same LAN connect directly and do
# not need to relay through private ranges.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255

# ── Logging ─────────────────────────────────────────────────────────────────
log-file=/var/log/turnserver/turnserver.log
simple-log
