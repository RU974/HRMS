# nginx site for HRMS: static SPA + Laravel API + Reverb websocket, all on 443.
#
# Replace CHANGE_ME values. Paths assume:
#   SPA build   /var/www/hrms/build/dist
#   Laravel     /var/www/hrms/backend   (public dir: /var/www/hrms/backend/public)
#   PHP-FPM     unix:/run/php/php8.3-fpm.sock   (adjust to your PHP version)
#   Reverb      127.0.0.1:8080          (see deploy/supervisor/hrms-realtime.conf)
#
# Camera / microphone / screen capture ONLY work on HTTPS pages, so TLS is not optional.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name CHANGE_ME.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name CHANGE_ME.example.com;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Chat attachments are capped at 10 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 12m;

    # Allow this origin to use the camera, microphone and screen capture.
    # (Some hardening guides ship "camera=(), microphone=()" — that would silently break calls.)
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Reverb websocket (chat + call signalling) ───────────────────────────
    # Browsers connect to wss://CHANGE_ME.example.com/app/<REVERB_APP_KEY>.
    # Only /app is exposed. Reverb's HTTP publish API (/apps/...) stays on loopback:
    # Laravel talks to it directly at 127.0.0.1:8080.
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reverb pings idle clients; keep the proxy from closing quiet sockets first.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:8080;
    }

    # ── Laravel API ─────────────────────────────────────────────────────────
    # /api/v1/...          REST API
    # /api/broadcasting/auth   websocket channel authorisation
    location /api/ {
        root /var/www/hrms/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/hrms/backend/public;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Never serve dotfiles or the private storage tree.
    location ~ /\.(?!well-known) { deny all; }

    # ── SPA ─────────────────────────────────────────────────────────────────
    root /var/www/hrms/build/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
