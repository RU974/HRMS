; Supervisor programs for the HRMS realtime stack.
; Install:  cp to /etc/supervisor/conf.d/hrms-realtime.conf
;           supervisorctl reread && supervisorctl update
; Adjust the paths and user to your server.
;
; Also required (crontab of the same user) — drives calls:expire-stale,
; calls:prune-signals and every other scheduled job:
;
;   * * * * * cd /var/www/hrms/backend && php artisan schedule:run >> /dev/null 2>&1
;
; Reverb keeps one socket open per connected browser tab. The default 1024
; file-descriptor limit is hit at roughly a thousand users. Raise it for the
; process that starts supervisord (systemd: LimitNOFILE=65535 in a drop-in for
; supervisor.service), and install ext-uv for the event loop beyond ~1000
; connections. Check the limit Reverb actually sees with:
;   cat /proc/$(pgrep -f reverb:start | head -1)/limits | grep "open files"

[program:hrms-reverb]
command=php /var/www/hrms/backend/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/hrms/backend
user=www-data
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/hrms/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; General background jobs (notifications, mail, exports).
; Realtime chat and call events are broadcast synchronously and do NOT depend on
; this worker — but the rest of the application does.
[program:hrms-queue]
command=php /var/www/hrms/backend/artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/var/www/hrms/backend
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/hrms/queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
